# CONFIGURACIÓN PRINCIPAL DE NGINX de la imagen web.
#
# Reemplaza al `/etc/nginx/nginx.conf` de la imagen oficial (nginx 1.30.6-alpine3.24, fijada por digest
# en el Dockerfile). Todo lo que sigue hasta el bloque `stream` es ese archivo SIN CAMBIOS: mismo
# usuario, `worker_processes auto` (al principio de línea, como lo espera
# `/docker-entrypoint.d/30-tune-worker-processes.sh`), mismo registro general, pid, eventos, tipos MIME,
# formato y registro de acceso de nivel `http` (el servidor lo reemplaza: ver `default.conf.template`) e
# `include /etc/nginx/conf.d/*.conf`, por donde entran la plantilla procesada y el resolver.
#
# Se añaden SOLO dos cosas: la carga del módulo njs de `stream` (ya instalado en la imagen,
# `nginx-module-njs`) y el bloque `stream` con el receptor de los errores de petición.

load_module modules/ngx_stream_js_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}

# RECEPTOR DE LOS ERRORES DE PETICIÓN (auditoría AUD-03, capa Nginx).
#
# El servidor web (`default.conf.template`) envía sus errores de petición por syslog a 127.0.0.1:5140
# en lugar de a stderr. Este servidor los recibe y `registro-errores.js` escribe en stderr solo cuatro
# campos de una lista cerrada; el mensaje original, con la consulta y el `Referer`, no se copia.
#
# - SOLO LOOPBACK: `127.0.0.1`, dentro del contenedor. No se publica y no hay EXPOSE de UDP.
# - SIN BUCLE: el `error_log` de este bloque va al archivo enlazado a stderr, NUNCA a syslog: lo que
#   escribe el receptor no vuelve al canal que recibe.
# - SIN RESPUESTA: `return ""` es el manejador de contenido que exige `stream`; con texto vacío Nginx
#   cierra la sesión sin enviar nada al emisor (`ngx_stream_return_module.c`).
# - PÉRDIDAS: UDP no garantiza la entrega. Si el receptor no está, puede aparecer el aviso
#   «send() failed ... while logging to syslog» sin el contenido, o perderse el diagnóstico en silencio
#   (se observó lo segundo con varios workers). La línea de acceso de la petición sigue escribiéndose,
#   pero no garantiza sustituir todo el diagnóstico: si la petición no llega a registrarse, no hay línea.
stream {
    error_log  /var/log/nginx/error.log notice;

    js_import registro_errores from /etc/nginx/njs/registro-errores.js;

    server {
        listen 127.0.0.1:5140 udp;
        js_preread registro_errores.recibir;
        return "";
    }
}
